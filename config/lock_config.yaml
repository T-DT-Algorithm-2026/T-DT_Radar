%YAML:1.0
---
# ==================== 卡尔曼测量噪声 R ====================
# YOLO 框中心在 x 方向的测量标准差，单位 px。
# 程序会用它除以 fx 得到 yaw 角标准差，再平方后写入 R 矩阵。
kf_measurement_noise_px: 69.42

# YOLO 框中心在 y 方向的测量标准差，单位 px。
# 程序会用它除以 fy 得到 pitch 角标准差，再平方后写入 R 矩阵。
kf_measurement_noise_y_px: 60

# ==================== 卡尔曼过程噪声 Q ====================
# CV 模型 x/y 方向的连续白噪声角加速度谱密度，分别对应 yaw/pitch，单位 rad^2/s^3。
# 程序会将每个值离散化为 [角度, 角速度] 的过程噪声矩阵。
kf_q_x_rad2_s3: 0.01
kf_q_y_rad2_s3: 0.003

# ==================== 卡尔曼初始化 ====================
# 第一次建立或重置卡尔曼时的角速度标准差，单位 deg/s。
kf_initial_velocity_std_deg_s: 10.0

#延迟补偿 s
control_delay_s: 0.025

# ==================== 无人机反制决策 ====================
# 对方无人机反制结束后，再次允许反制的等待时间，单位 s。
countermeasure_interval_s: 5.0

# match_info 超时时间，单位 s。
match_info_timeout_s: 2.0

# ==================== 第一次雷达锁定偏置 ====================
# yaw 固定偏置，单位 deg。
first_lock_yaw_offset_deg: -2.0

# pitch 固定偏置，单位 deg。
first_lock_pitch_offset_deg: 0.2

# ==================== 云台控制增益 ====================
# yaw 角度误差的比例增益。
kp_x: 1.5

# pitch 角度误差的比例增益。
kp_y: 1.2

# ==================== 数据可视化与录制 ====================
# 相机1压缩开关：0=不压缩，1=异步压缩并发布 /compressed_image
compress_detect_image: 1

# 相机1压缩画面绘制开关：调试时设为1，比赛录制时设为0
draw_detect_image: 1

# 相机2压缩开关：0=不压缩，1=异步压缩并发布 /compressed_image2
compress_image: 1

# 压缩画面绘制开关：调试时设为1，比赛录制时设为0
draw_compressed_image: 1

%YAML:1.0
---
# ==================== 卡尔曼测量噪声 R ====================
# YOLO 框中心在 x 方向的测量标准差，单位 px。
# 程序会用它除以 fx 得到 yaw 角标准差，再平方后写入 R 矩阵。
kf_measurement_noise_px: 4.0

# YOLO 框中心在 y 方向的测量标准差，单位 px。
# 程序会用它除以 fy 得到 pitch 角标准差，再平方后写入 R 矩阵。
kf_measurement_noise_y_px: 16.0

# ==================== 卡尔曼过程噪声 Q ====================
# 连续白噪声模型的标量噪声谱密度 q，单位 rad^2/s^3。
# 它不是普通角加速度。程序按照
# Q = q * [dt^3/3, dt^2/2; dt^2/2, dt]
# 分别构造 yaw 和 pitch 的过程噪声矩阵。
kf_q_rad2_s3: 0.01

# ==================== 卡尔曼初始化 ====================
# 第一次建立或重置卡尔曼时的角速度标准差，单位 deg/s。
kf_initial_velocity_std_deg_s: 10.0

#延迟补偿 s
control_delay_s: 0.050

# Foxglove 调试画面开关：0=不发布，1=发布
if_foxglove: 1
